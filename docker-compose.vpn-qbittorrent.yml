# Optional, with docker-compose.vpn.yml: a NEW qBittorrent that runs through
# the VPN. Support/VPN.md, step 2.
#
# !! ALREADY RUN QBITTORRENT? Don't use this file. Over a qbittorrent service
# !! in your docker-compose.yml it replaces that service's image, its /config
# !! (settings, torrents list, password) and its /downloads (save path).
# !! Use docker-compose.vpn-qbittorrent-existing.yml instead: it only moves
# !! your qBittorrent into the VPN.
#
# COMPOSE_FILE=docker-compose.yml:docker-compose.vpn.yml:docker-compose.vpn-qbittorrent.yml

services:
  gluetun:
    environment:
      # qBittorrent's listening port follows Proton's forwarded port (Gluetun's
      # own example). Needs "Bypass authentication for clients on localhost"
      # ticked in qBittorrent → Options → Web UI, and qBittorrent's web page on
      # port 8080 inside the container.
      - >-
        VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --tries=5 --retry-connrefused
        --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      - >-
        VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --tries=5 --retry-connrefused
        --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
    ports:
      # qBittorrent's web page and API (its peer port goes through the VPN, not here)
      - "8080:8080"
    networks:
      default:
        aliases:
          - slskd
          - qbittorrent

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    network_mode: "service:gluetun"
    ports: !reset []
    networks: !reset null
    hostname: !reset null
    dns: !reset []
    dns_search: !reset []
    dns_opt: !reset []
    extra_hosts: !reset []
    mac_address: !reset null
    links: !reset []
    domainname: !reset null
    depends_on:
      gluetun:
        condition: service_started
        restart: true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/London}
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent:/config
      # the same downloads folder SYNCHRO.S reads (set qBittorrent's save path to /downloads)
      - ./downloads:/downloads
    restart: unless-stopped
